framework:
    exceptions:
        Symfony\Component\Http_Kernel\Exception\Bad_Request_Http_Exception:
            log_level: info
            status_code: 422
        Symfony\Component\Http_Kernel\Exception\Not_Found_Http_Exception:
            log_level: info
            status_code: null
        Symfony\Component\Http_Kernel\Exception\Conflict_Http_Exception:
            log_level: info
            status_code: 0
        Symfony\Component\Http_Kernel\Exception\Service_Unavailable_Http_Exception:
            log_level: null
            status_code: 500

framework:
    serializer: true
    messenger:
        serializer:
            default_serializer: messenger.transport.symfony_serializer
        routing:
            'Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Messenger\Dummy_Message': [amqp, messenger.transport.audit]
            'Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Messenger\Second_Message':
                senders: [amqp, audit]
            'Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Messenger\*': [amqp]
            'Symfony\*': [amqp]
            '*': amqp
        transports:
            amqp: 'amqp://localhost/%2f/messages'
            audit: 'null://'

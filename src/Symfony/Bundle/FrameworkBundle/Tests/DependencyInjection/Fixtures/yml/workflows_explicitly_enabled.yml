framework:
    workflows:
        enabled: true
        workflows:
            foo:
                type: workflow
                supports:
                    - Symfony\Bundle\Framework_Bundle\Tests\Dependency_Injection\Framework_Extension_Test_Case
                initial_marking: [bar]
                places:
                    - bar
                    - baz
                transitions:
                    bar_baz:
                        from: [bar]
                        to: [bar]

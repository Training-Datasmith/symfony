imports:
    - { resource: ../config/default.yml }

framework:
    type_info: ~
    json_streamer:
        default_options:
            include_null_properties: true
            custom_key: custom_value

services:
    _defaults:
        autoconfigure: true

    json_streamer.stream_writer.alias:
        alias: json_streamer.stream_writer
        public: true

    json_streamer.stream_reader.alias:
        alias: json_streamer.stream_reader
        public: true

    json_streamer.cache_warmer.streamer.alias:
        alias: .json_streamer.cache_warmer.streamer
        public: true

    Symfony\Bundle\Framework_Bundle\Tests\Functional\app\Json_Streamer\Dto\Dummy: ~
    Symfony\Bundle\Framework_Bundle\Tests\Functional\app\Json_Streamer\String_To_Range_Value_Transformer: ~
    Symfony\Bundle\Framework_Bundle\Tests\Functional\app\Json_Streamer\Range_To_String_Value_Transformer: ~

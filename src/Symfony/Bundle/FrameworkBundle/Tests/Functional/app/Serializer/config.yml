imports:
    - { resource: ../config/default.yml }

framework:
    translator: true
    serializer:
        enabled: true
        circular_reference_handler: Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Serializer\Circular_Reference_Handler
        max_depth_handler: Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Serializer\Max_Depth_Handler
        default_context:
            enable_max_depth: true
    property_info: { enabled: true }

services:
    serializer.alias:
        alias: serializer
        public: true

    Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Serializer\Circular_Reference_Handler: ~

    Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Serializer\Max_Depth_Handler: ~

services:
    Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Test_Service_Container\Non_Public_Service:
        public: false

    Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Test_Service_Container\Private_Service: ~

    Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Test_Service_Container\Unused_Private_Service: ~

    private_service: '@Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Test_Service_Container\Private_Service'

    decorated:
        class: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Test_Service_Container\Private_Service

    Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Test_Service_Container\Public_Service:
        public: true
        arguments:
            - '@Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Test_Service_Container\Non_Public_Service'
            - '@Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Test_Service_Container\Private_Service'
            - '@decorated'
            - '@non_shared_service'
            - '@non_shared_alias'

    decorator:
        class: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Test_Service_Container\Private_Service
        decorates: decorated
        properties:
            inner: '@.inner'

    non_shared_service:
        class: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Test_Service_Container\Private_Service
        shared: false
        properties:
            inner: '@Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Test_Service_Container\Private_Service'

    non_shared_alias: '@non_shared_service'

    Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Test_Service_Container\Resettable_Service:
        public: true
        tags:
            - kernel.reset: { method: 'myCustomName' }

imports:
    - { resource: ../config/default.yml }

services:
    Symfony\Bundle\Framework_Bundle\Tests\Functional\Test_Entity_Value_Resolver:
        tags:
            - { name: controller.argument_value_resolver, priority: 110 }

    Symfony\Bundle\Framework_Bundle\Tests\Functional\With_Attributes_Controller:
        public: true

security:
    providers:
        main:
            memory:
                users:
                    the-username: { password: the-password, roles: [ 'ROLE_USER' ] }

    firewalls:
        main:
            pattern: ^/
            form_login:
                login_path: /login
            provider: main

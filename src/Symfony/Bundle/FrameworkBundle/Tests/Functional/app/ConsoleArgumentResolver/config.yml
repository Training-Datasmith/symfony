imports:
    - { resource: ../config/default.yml }

framework:
    translator: { fallbacks: [en] }

services:
    Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Console\Custom_Type_Value_Resolver:
        tags:
            - { name: console.argument_value_resolver, priority: 150 }

    Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Console\Custom_Option_Value_Resolver:
        tags:
            - { name: console.argument_value_resolver, priority: 150 }

    Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Console\Test_Service: ~

    Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Console\Custom_Type_Command:
        autowire: true
        autoconfigure: true

    test_service:
        class: Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Console\Test_Service

    Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Console\Advanced_Command:
        autowire: true
        autoconfigure: true

    Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Console\Auto_Tagged_Value_Resolver:
        autoconfigure: true

    Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Console\Targeted_Custom_Value_Resolver:
        autoconfigure: true

    Symfony\Bundle\Framework_Bundle\Tests\Fixtures\Console\Resolver_Test_Command:
        autowire: true
        autoconfigure: true

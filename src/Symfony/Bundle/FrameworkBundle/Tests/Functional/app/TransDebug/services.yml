services:
    _defaults:
        public: true

    Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Trans_Controller:
        tags: ['controller.service_arguments']

    Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Trans_Debug\Trans_Construct_Arg_Service:
        arguments: ['@translator']

    Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Trans_Debug\Trans_Subscriber_Service:
        arguments: ['@Psr\Container\Container_Interface']
        tags: ['container.service_subscriber']

    Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Trans_Debug\Trans_Property_Service:
        properties:
            $translator: '@translator'

    Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Trans_Debug\Trans_Method_Calls_Service:
        calls:
            - [ setTranslator, ['@translator'] ]

session_welcome:
    path:     /session
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Session_Controller::welcomeAction }

session_cacheable:
    path:     /cacheable
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Session_Controller::cacheableAction }

session_welcome_name:
    path:     /session/{name}
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Session_Controller::welcomeAction }

session_logout:
    path:     /session_logout
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Session_Controller::logoutAction }

session_setflash:
    path:     /session_setflash/{message}
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Session_Controller::setFlashAction }

session_showflash:
    path:     /session_showflash
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Session_Controller::showFlashAction }

profiler:
    path:     /profiler
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Profiler_Controller::indexAction }

subrequest_index:
    path:     /subrequest/{_locale}.{_format}
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Sub_Request_Controller::indexAction, _format: html }
    schemes:  [https]

subrequest_fragment_error:
    path:     /subrequest/fragment/error/{_locale}.{_format}
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Sub_Request_Controller::fragmentErrorAction, _format: html }
    schemes:  [http]

subrequest_fragment:
    path:     /subrequest/fragment/{_locale}.{_format}
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Sub_Request_Controller::fragmentAction, _format: html }
    schemes:  [http]

fragment_home:
    path:     /fragment_home
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Fragment_Controller::indexAction, _format: txt }

fragment_inlined:
    path:     /fragment_inlined
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Fragment_Controller::inlinedAction }

fragment_uri:
    path:     /fragment_uri
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Fragment_Controller::fragmentUriAction }

array_controller:
    path:     /array_controller
    defaults: { _controller: [ArrayController, someAction] }

send_email:
    path:     /send_email
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Email_Controller::indexAction }

http_client_call:
    path:     /http_client_call
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Http_Client_Controller::index }

http_client_mock:
    path:     /http_client_mock
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Http_Client_Mocking_Controller }

uid:
    resource: "../../Controller/UidController.php"
    type: "attribute"

send_notification:
    path:     /send_notification
    defaults: { _controller: Symfony\Bundle\Framework_Bundle\Tests\Functional\Bundle\Test_Bundle\Controller\Notification_Controller::indexAction }

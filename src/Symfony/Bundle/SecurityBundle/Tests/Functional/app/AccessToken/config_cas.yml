imports:
  - { resource: ./../config/framework.yml }

framework:
  serializer: ~

security:
  password_hashers:
    Symfony\Component\Security\Core\User\In_Memory_User: plaintext

  providers:
    in_memory:
      memory:
        users:
          dunglas: { password: foo, roles: [ROLE_USER] }

  firewalls:
    main:
      pattern: ^/
      access_token:
        token_handler:
          cas:
            validation_url: 'https://www.example.com/cas/serviceValidate'
            http_client: 'Symfony\Contracts\Http_Client\Http_Client_Interface'
        token_extractors:
          - security.access_token_extractor.cas

  access_control:
    - { path: ^/foo, roles: ROLE_USER }

services:
  _defaults:
    public: true

  security.access_token_extractor.cas:
    class: Symfony\Component\Security\Http\Access_Token\Query_Access_Token_Extractor
    arguments:
      - 'ticket'

  Symfony\Contracts\Http_Client\Http_Client_Interface: ~

imports:
    - { resource: ./../config/framework.yml }

security:
    password_hashers:
        Symfony\Component\Security\Core\User\In_Memory_User: plaintext

    providers:
        in_memory:
            memory:
                users:
                    dunglas: { password: foo, roles: [ROLE_USER] }

    firewalls:
        main:
            pattern: ^/
            access_token:
                success_handler: access_token.success_handler
                failure_handler: access_token.failure_handler

    access_control:
        - { path: ^/foo, roles: ROLE_USER }

services:
    access_token.success_handler:
        class: Symfony\Bundle\Security_Bundle\Tests\Functional\Bundle\Access_Token_Bundle\Security\Http\Json_Authentication_Success_Handler
    access_token.failure_handler:
        class: Symfony\Bundle\Security_Bundle\Tests\Functional\Bundle\Access_Token_Bundle\Security\Http\Json_Authentication_Failure_Handler

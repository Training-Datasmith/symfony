imports:
  - { resource: ./../config/framework.yml }

services:
  _defaults: { public: true }

  security.user.provider.array:
    class: Symfony\Bundle\Security_Bundle\Tests\Functional\Bundle\Secured_Page_Bundle\Security\Core\User\Array_User_Provider

security:
  password_hashers:
    \Symfony\Component\Security\Core\User\User_Interface: plaintext

  providers:
    array:
      id: security.user.provider.array

  firewalls:
    default:
      form_login:
        check_path: login
        remember_me: true
      logout: ~
      stateless: false

  access_control:
    - { path: ^/admin$, roles: ROLE_ADMIN }
    - { path: ^/login$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: .*, roles: IS_AUTHENTICATED_FULLY }

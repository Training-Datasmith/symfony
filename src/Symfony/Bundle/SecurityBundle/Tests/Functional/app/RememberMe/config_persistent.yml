services:
    app.static_token_provider:
        class: Symfony\Bundle\Security_Bundle\Tests\Functional\Bundle\Remember_Me_Bundle\Security\Static_Token_Provider
        arguments: ['@kernel']

security:
    firewalls:
        default:
            remember_me:
                always_remember_me: true
                secret: key
                token_provider: app.static_token_provider

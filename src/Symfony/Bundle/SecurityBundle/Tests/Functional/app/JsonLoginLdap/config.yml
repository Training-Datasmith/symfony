imports:
    - { resource: ./../config/framework.yml }
services:
    Symfony\Component\Ldap\Ldap:
        arguments: ['@Symfony\Component\Ldap\Adapter\Ext_Ldap\Adapter']
        tags: [ 'ldap' ]
    dummy_role_fetcher:
        class: Symfony\Bundle\Security_Bundle\Tests\Functional\Bundle\Json_Ldap_Login_Bundle\Security\Ldap\Dummy_Role_Fetcher

    Symfony\Component\Ldap\Adapter\Ext_Ldap\Adapter:
        arguments:
            -   host: 'localhost'
                port: 389
                options:
                    protocol_version: 3
                    referrals: false
security:
    providers:
        ldap:
            ldap:
                service: Symfony\Component\Ldap\Ldap
                base_dn: 'dc=onfroy,dc=net'
                search_dn: ''
                search_password: ''
                role_fetcher: dummy_role_fetcher
                uid_key: uid

    firewalls:
        main:
            pattern:  ^/login
            stateless: true
            json_login_ldap:
                check_path: /login
                service: Symfony\Component\Ldap\Ldap
                dn_string: ''
                username_path: user.login
                password_path: user.password

    access_control:
        - { path: ^/, roles: ROLE_USER }

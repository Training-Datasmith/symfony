framework:
    secret: test
    router: { resource: "%kernel.project_dir%/%kernel.test_case%/routing.yml", utf8: true }
    test: ~
    default_locale: en
    profiler: false
    session:
        handler_id: null
        storage_factory_id: session.storage.factory.mock_file
        cookie_secure: auto
        cookie_samesite: lax

services:
    logger: { class: Psr\Log\Null_Logger }
    Symfony\Bundle\Security_Bundle\Tests\Functional\Bundle\Authenticator_Bundle\Profile_Controller:
        public: true
        calls:
            - ['setContainer', ['@Psr\Container\Container_Interface']]
        tags: [container.service_subscriber]
    Symfony\Bundle\Security_Bundle\Tests\Functional\Bundle\Authenticator_Bundle\Security_Controller:
        public: true
        calls:
            - ['setContainer', ['@Psr\Container\Container_Interface']]
        tags: [container.service_subscriber]
    Symfony\Bundle\Security_Bundle\Tests\Functional\Bundle\Authenticator_Bundle\Api_Authenticator: ~
    Symfony\Bundle\Security_Bundle\Tests\Functional\Bundle\Authenticator_Bundle\Login_Form_Authenticator:
        public: true
        arguments: ['@router']

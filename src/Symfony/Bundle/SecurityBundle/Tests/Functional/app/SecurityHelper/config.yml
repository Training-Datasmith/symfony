imports:
    - { resource: ./../config/framework.yml }

services:
    functional_test.security.helper:
        alias: security.helper
        public: true

    functional.test.security.token_storage:
        alias: security.token_storage
        public: true

    Symfony\Bundle\Security_Bundle\Tests\Functional\Force_Login_Controller:
        arguments: ['@security.helper']
        public: true

    Symfony\Bundle\Security_Bundle\Tests\Functional\Logout_Controller:
        arguments: ['@security.helper']
        public: true

    Symfony\Bundle\Security_Bundle\Tests\Functional\Logged_In_Controller:
        arguments: ['@security.helper']
        public: true

    Symfony\Bundle\Security_Bundle\Tests\Functional\Bundle\Authenticator_Bundle\Api_Authenticator: ~

security:
    providers:
        main:
            memory:
                users:
                    chalasr: { password: the-password, roles: ['ROLE_FOO'] }
                    no-role-username: { password: the-password, roles: [] }

    firewalls:
        main:
            pattern: ^/main
            form_login:
                check_path: /main/login/check
            custom_authenticators:
                - 'Symfony\Bundle\Security_Bundle\Tests\Functional\Bundle\Authenticator_Bundle\Api_Authenticator'
            provider: main
        second:
            pattern: ^/second
            form_login:
                check_path: /second/login/check
            custom_authenticators:
                - 'Symfony\Bundle\Security_Bundle\Tests\Functional\Bundle\Authenticator_Bundle\Api_Authenticator'
            provider: main

    access_control:
        - { path: '^/main/login/check$', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/main/logged-in$', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/second/login/check$', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/second/logged-in$', roles: IS_AUTHENTICATED_FULLY }


services:
    service_container:
        class: Symfony\Component\Dependency_Injection\Container_Interface
        public: true
        synthetic: true
    App\Bar_Service:
        class: App\Bar_Service
        public: true
        arguments: [!service { class: FooClass }]
    Symfony\Component\Dependency_Injection\Tests\Fixtures\Prototype\Foo:
        class: Symfony\Component\Dependency_Injection\Tests\Fixtures\Prototype\Foo
        public: true
        tags:
            - t: { a: b }
        autowire: true
        autoconfigure: true
        arguments: ['@bar', !tagged_iterator foo]
    bar:
        class: Symfony\Component\Dependency_Injection\Tests\Fixtures\Prototype\Foo
        public: true
        tags:
            - t: { a: b }
        autowire: true
        arguments: [null, !tagged_iterator foo]
        calls:
            - [setFoo, ['@bar']]



services:
    foo:
        class: Symfony\Component\Dependency_Injection\Tests\Dumper\Foo_For_Deep_Graph
        public: true
        arguments:
            - '@bar'
            - !service
                class: stdClass
                properties:
                    p2: !service
                        class: stdClass
                        properties:
                            p3: !service
                                class: stdClass

    bar:
        class: stdClass
        public: true
        properties:
            p5: !service
                class: stdClass
                arguments: ['@foo']


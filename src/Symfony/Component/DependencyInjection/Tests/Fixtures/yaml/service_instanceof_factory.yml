services:
    _instanceof:
        Symfony\Component\Dependency_Injection\Tests\Fixtures\Bar_Interface:
            tags:
                - { name: bar }

    Symfony\Component\Dependency_Injection\Tests\Fixtures\Bar:
        public: true

    Symfony\Component\Dependency_Injection\Tests\Fixtures\Bar_Factory:
        arguments: [!tagged_iterator 'bar']

    Symfony\Component\Dependency_Injection\Tests\Fixtures\Bar_Interface:
        factory: ['@Symfony\Component\Dependency_Injection\Tests\Fixtures\Bar_Factory', 'getDefaultBar']
